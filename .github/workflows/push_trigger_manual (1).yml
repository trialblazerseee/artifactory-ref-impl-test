```yaml
name: Maven Package Build Manual

on:
  workflow_dispatch:

jobs:
  build-artifactory-server:
    runs-on: ubuntu-latest

    env:
      NAMESPACE: ${{ secrets.dev_namespace_docker_hub }}
      SERVICE_NAME: artifactory-server
      SERVICE_LOCATION: artifacts/

    steps:

      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup environment
      - name: Setup branch and environment
        run: |
          echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # Build Docker image
      - name: Build image
        run: |
          cd "$SERVICE_LOCATION"

          docker build . \
            --file Dockerfile \
            --tag "$SERVICE_NAME"

      # Login to Docker Hub
      - name: Log into Docker Hub
        run: |
          echo "${{ secrets.release_docker_hub }}" | \
            docker login docker.io \
            --username "${{ secrets.actor_docker_hub }}" \
            --password-stdin

      # Tag and push Docker image
      - name: Push image
        run: |
          IMAGE_ID="${NAMESPACE}/${SERVICE_NAME}"

          # Convert Docker repository name to lowercase
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')

          # Convert branch name to a valid Docker tag
          VERSION=$(echo "$BRANCH_NAME" | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9._-]/-/g')

          echo "----------------------------------------"
          echo "IMAGE_ID = $IMAGE_ID"
          echo "VERSION  = $VERSION"
          echo "----------------------------------------"

          # Tag image
          docker tag "$SERVICE_NAME" "$IMAGE_ID:$VERSION"

          # Push image
          docker push "$IMAGE_ID:$VERSION"
```
